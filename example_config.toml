[email]
server = "smtp.gmail.com"
port = 587
starttls = true         # Use STARTTLS
authentication = true   # Login with username and password
user = "your_email_address@gmail.com"
password = "password"
from = "your_email_address@gmail.com"
to = ["email1@example.com","email2@example.com"]

[firefly]
url = "http://firefly_instance:8085"
access_token = "your_api_access_token_key"

[logging]
# See https://github.com/cetyler/log_to_db on how to setup database
enable_logging = true          # Use false to disable logging, true to enable logging
logging_database = "duckdb"    # duckdb, postgresql and sqlite are supported
database_location = "~/firefly.duckdb" # Will be ignored if database is set to postgresql
username = "user"                      # Will only be used if database is set to postgresql
password = "password"                  # Will only be used if database is set to postgresql
address = "localhost"                  # Will only be used if database is set to postgresql
port = 5432                            # Will only be used if database is set to postgresql
database = "raw_data"                  # Will only be used if database is set to postgresql

